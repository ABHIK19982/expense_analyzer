<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Analyzer</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="guest-view" style="display:none;">
    <div class="parallax-bg">
      <div class="menu-bar">
        <a href="/login.html">Login</a>
        <a href="/signup.html">Signup</a>
      </div>
      <div class="mini-container">
        <h1>Welcome to Expense Analyzer</h1>
        <h2>One stop Solution to aggregate, manage and analyze monthly expenses</h2>
        <p><a href="/login.html">Login</a> to get started</p>
      </div>
    </div>
  </div>

  <div id="user-view" style="display:none;">
    <div class="menu-bar">
      <a href="/">Add</a>
      <a href="/#reports">View</a>
      <p id="welcome-user">Welcome</p>
      <a href="#" id="logout-btn">Logout</a>
    </div>
    <h1>Monthly Expenses</h1>
    <div class="container">
      <div class="section">
        <h2>Add an Expense</h2>
        <form class="form-container" id="upload-form">
          <input type="file" name="bill_image" id="bill_image" accept=".jpg,.jpeg,.pdf" onchange="validateFile(this)">
          <button type="submit">Upload</button>
        </form>
        <label>Or</label>
        <form class="form-container" id="expense-form">
          <label class="form-label">Date</label>
          <input type="date" name="expense_date" required>
          <label class="form-label">Product Name</label>
          <input type="text" name="commodity" placeholder="Object Name" required>
          <label class="form-label">Product Type</label>
          <select name="type" required>
            <option value="">Select Product Type</option>
            <option value="Salary">Salary</option>
            <option value="Credits">Credits</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Grocery">Grocery</option>
            <option value="Green-Grocery">Green-Grocery</option>
            <option value="Clothes">Clothes</option>
            <option value="Bills">Bills</option>
            <option value="House-rent">House-rent</option>
            <option value="Other-rents">Other-rents</option>
            <option value="Miscellaneous">Miscellaneous</option>
          </select>
          <label class="form-label">Expense</label>
          <input type="number" name="price" placeholder="Price" required step="any">
          <button type="submit">Submit</button>
        </form>
      </div>

      <div class="section" id="reports">
        <h2>View Expense Reports</h2>
        <div class="btn-container" id="month-buttons"></div>
        <div class="date-range">
          <label><strong>Date Range</strong></label>
          <form id="date-range-form">
            <label>From:</label>
            <input type="date" name="start_date" required>
            <label>To:</label>
            <input type="date" name="end_date" required>
            <button type="submit">Search</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
