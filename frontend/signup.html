<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Expense Analyzer</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="container">
    <div class="sub-container">
      <form class="login-form" id="signup-form">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>First name</label>
        <input type="text" name="fname" required>
        <label>Last Name</label>
        <input type="text" name="lname" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Family size</label>
        <input type="number" name="fam_size" required min="1">
        <button class="signup_page_button" type="submit">Sign Up</button>
      </form>
    </div>
    <div class="sub-container">
      <p>
        Already an user? <a href="/login.html">Login</a> here
      </p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
